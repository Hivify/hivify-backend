  # ============================================================
  # All migrations
  # ============================================================

  migrate-all:
    desc: Apply migrations for all bounded contexts
    deps:
      - migrate-house
      - migrate-association
      - migrate-identity
      - migrate-department
      - migrate-feed
      - migrate-complaint
      - migrate-onboarding