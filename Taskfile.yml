  add-user-migration:
    desc: Create EF Core migration for User Management
    cmds:
      - dotnet ef migrations add {{.migrationName | default "InitialCreate"}} --context UserManagementDbContext --project src/UserMgmt/UserMgmt.Infrastructure/UserMgmt.Infrastructure.csproj --startup-project Hivify.Api/Hivify.Api.csproj

  migrate-user:
