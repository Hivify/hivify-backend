version: '3'

tasks:

  # ============================================================
  # Houses
  # ============================================================

  add-house-migration:
    desc: Create EF Core migration for Houses
    cmds:
      - dotnet ef migrations add {{.migrationName | default "InitialCreate"}} --context HouseDbContext --project src/Houses/Infrastructure/Houses.Infrastructure.csproj --startup-project Hivify.Api/Hivify.Api.csproj

  migrate-house:
    desc: Apply EF Core migrations for Houses
    cmds:
      - dotnet ef database update --context HouseDbContext --project src/Houses/Infrastructure/Houses.Infrastructure.csproj --startup-project Hivify.Api/Hivify.Api.csproj


  # ============================================================
  # Department
  # ============================================================

  add-department-migration:
